name: VS1 source guard

on:
  push:
    branches:
      - main
      - 'vs1/**'
  pull_request:

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify recovered Unreal player files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "Unreal/DaoVoTan3D.uproject"
            "Unreal/Config/DefaultEngine.ini"
            "Unreal/Config/DefaultInput.ini"
            "Unreal/Source/DaoVoTan3D.Target.cs"
            "Unreal/Source/DaoVoTan3DEditor.Target.cs"
            "Unreal/Source/DaoVoTan3D/DaoVoTan3D.Build.cs"
            "Unreal/Source/DaoVoTan3D/GateCharacter.h"
            "Unreal/Source/DaoVoTan3D/GateCharacter.cpp"
            "Unreal/Source/DaoVoTan3D/GateGameMode.h"
            "Unreal/Source/DaoVoTan3D/GateGameMode.cpp"
            "Unreal/Source/DaoVoTan3D/SnapshotPresentationAdapter.cpp"
            "Unreal/Source/DaoVoTan3D/AppearanceComponent.cpp"
            "Docs/V1_EXECUTION_GATE.md"
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Guard simulation boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn "tu-ti-n" Unreal/Source Unreal/Config --exclude='*.md'; then
            echo "Direct tu-ti-n reference detected inside Unreal source/config. Use the Bridge contract instead."
            exit 1
          fi

      - name: Reject generated Unreal directories
        shell: bash
        run: |
          set -euo pipefail
          for dir in Unreal/Binaries Unreal/DerivedDataCache Unreal/Intermediate Unreal/Saved; do
            if [ -n "$(git ls-files -- "$dir")" ]; then
              echo "Generated Unreal directory must not be committed: $dir"
              exit 1
            fi
          done
